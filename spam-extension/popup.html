<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 { margin-top: 0; color: #333; }
    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
    }
    button {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #45a049; }
    #result-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
    .Spam { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
    .Ham { background-color: #def7ec; color: #03543f; border: 1px solid #bcf0da; }
  </style>
  <title>Spam Classifier</title>
</head>
<body>
  <h3>Email Safety Scanner</h3>
  <label for="emailText">Paste body text to analyze:</label>
  <textarea id="emailText" placeholder="Dear user, click this urgent link..."></textarea>
  <button id="scanBtn">Analyze Text</button>
  
  <div id="result-box"></div>

  <script src="popup.js"></script>
</body>
</html>
